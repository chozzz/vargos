name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install
      - run: pnpm run typecheck
      - run: pnpm run test:run
      - run: pnpm lint
      - run: pnpm run build
      - name: Smoke test (boot + timeout)
        run: |
          # Seed a minimal, provider-configured data dir so the first-run gate in
          # index.ts lets the daemon boot; then confirm it stays up (killed by the
          # timeout → exit 124) rather than crashing (any other non-zero).
          export VARGOS_DATA_DIR="$RUNNER_TEMP/vargos-smoke"
          mkdir -p "$VARGOS_DATA_DIR/agent"
          printf '{"gateway":{}}' > "$VARGOS_DATA_DIR/config.json"
          printf '{"defaultProvider":"anthropic","defaultModel":"claude-sonnet-4-20250514"}' > "$VARGOS_DATA_DIR/agent/settings.json"
          printf '{"anthropic":{"type":"api_key","key":"ci-smoke"}}' > "$VARGOS_DATA_DIR/agent/auth.json"
          printf '{"providers":{"anthropic":{"baseUrl":"https://api.anthropic.com/v1","api":"anthropic"}}}' > "$VARGOS_DATA_DIR/agent/models.json"
          timeout 10 node dist/index.js || [ $? -eq 124 ]
